<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz IA — Collégiens</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ══ HOME ══ -->
    <div id="screen-home" class="screen active">
      <div class="hero-badge"><span></span>Quiz pédagogique · IA</div>
      <h1 class="hero-title">L'Intelligence<br><em>Artificielle</em></h1>
      <p class="hero-sub">12 questions pour tester tes connaissances sur l'IA, le cerveau, les tokens, la reconnaissance faciale et les deepfakes.</p>

      <div class="hero-cards">
        <div class="hero-card">
          <div class="num">12</div>
          <div class="lbl">questions</div>
        </div>
        <div class="hero-card">
          <div class="num">5</div>
          <div class="lbl">thèmes</div>
        </div>
      </div>

      <button class="btn-start" onclick="startQuiz()">
        Commencer le quiz
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <!-- ══ QUIZ ══ -->
    <div id="screen-quiz" class="screen">
      <div class="quiz-actions">
        <button class="btn-home" onclick="goHome()">← Retour à l'accueil</button>
      </div>

      <div class="top-bar">
        <div class="q-counter">Question <strong id="q-num">1</strong> / 12</div>
        <div class="progress-wrap">
          <div class="progress-fill" id="progress" style="width:0%"></div>
        </div>
        <div class="score-live" id="score-live">0 pts</div>
      </div>

      <div id="q-zone"></div>
    </div>

    <!-- ══ RESULT ══ -->
    <div id="screen-result" class="screen">
      <div class="result-ring">
        <svg viewBox="0 0 160 160" width="160" height="160">
          <circle class="ring-track" cx="80" cy="80" r="70"/>
          <circle class="ring-fill" id="ring-fill" cx="80" cy="80" r="70"/>
        </svg>
        <div class="ring-label">
          <div class="ring-score" id="ring-score">0</div>
          <div class="ring-total">sur 12</div>
        </div>
      </div>

      <h2 class="result-title" id="result-title">Résultats</h2>
      <p class="result-msg" id="result-msg"></p>

      <div class="result-grid">
        <div class="r-card">
          <div class="rn" id="r-correct" style="color:#1D9E75">0</div>
          <div class="rl">bonnes réponses</div>
        </div>
        <div class="r-card">
          <div class="rn" id="r-wrong" style="color:#E24B4A">0</div>
          <div class="rl">mauvaises réponses</div>
        </div>
        <div class="r-card">
          <div class="rn" id="r-pct" style="color:var(--gold)">0%</div>
          <div class="rl">score</div>
        </div>
      </div>

      <div class="review-list" id="review-list"></div>

      <button class="btn-retry" onclick="restartQuiz()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M1 4v6h6M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        Recommencer
      </button>
    </div>

  </div>

  <canvas class="confetti" id="confetti"></canvas>

  <script src="script.js"></script>
</body>
</html>
